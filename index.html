<!DOCTYPE html>
<html>
  <head>
    <title>GPA Calculator</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4660658766283861"
     crossorigin="anonymous"></script>
    
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
 
      body {
        font-family: Georgia, serif;
        background: #f0f4ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
      }
 
      h1 {
        font-size: 2.4rem;
        color: #1a1a2e;
        margin-bottom: 6px;
      }
 
      .subtitle {
        color: #888;
        margin-bottom: 24px;
        font-size: 1rem;
      }
 
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 28px;
        flex-wrap: wrap;
        justify-content: center;
      }
 
      .tab {
        padding: 10px 22px;
        border-radius: 999px;
        border: 2px solid #c7d2fe;
        background: white;
        color: #4f46e5;
        font-size: 0.95rem;
        cursor: pointer;
        font-family: Georgia, serif;
      }
 
      .tab.active {
        background: #4f46e5;
        color: white;
        border-color: #4f46e5;
      }
 
      .tab:hover:not(.active) {
        background: #eef2ff;
      }
 
      .scale-info {
        background: white;
        border: 2px solid #e0e7ff;
        border-radius: 12px;
        padding: 14px 20px;
        margin-bottom: 24px;
        width: 100%;
        max-width: 600px;
        font-size: 0.9rem;
        color: #555;
        line-height: 1.7;
      }
 
      .scale-info strong {
        color: #4f46e5;
        display: block;
        margin-bottom: 4px;
      }
 
      #subjects {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        max-width: 600px;
      }
 
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
 
      .row input[type="text"] {
        flex: 2;
      }
 
      .row input[type="number"] {
        flex: 1;
      }
 
      .delete-btn {
        background: #fee2e2;
        color: #ef4444;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
        font-size: 1rem;
        flex-shrink: 0;
      }
 
      .delete-btn:hover {
        background: #fca5a5;
      }
 
      input {
        padding: 10px 14px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        width: 100%;
        background: white;
        font-family: Georgia, serif;
      }
 
      input:focus {
        outline: none;
        border-color: #4f46e5;
      }
 
      .buttons {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }
 
      button {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        background: #4f46e5;
        color: white;
        font-family: Georgia, serif;
      }
 
      button:hover {
        background: #3730a3;
      }
 
      #clearBtn {
        background: #e5e5e5;
        color: #333;
      }
 
      #clearBtn:hover {
        background: #ccc;
      }
 
      .result-box {
        margin-top: 30px;
        background: white;
        border: 2px solid #e0e7ff;
        border-radius: 16px;
        padding: 24px 40px;
        text-align: center;
        width: 100%;
        max-width: 600px;
      }
 
      #result {
        font-size: 2.4rem;
        color: #1a1a2e;
        font-weight: bold;
      }
 
      #grade-label {
        font-size: 1rem;
        color: #666;
        margin-top: 8px;
      }
 
      #letter-grade {
        font-size: 1.3rem;
        color: #4f46e5;
        margin-top: 6px;
        font-weight: bold;
      }
 
      .error {
        color: #ef4444;
        font-size: 0.95rem;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
 
    <h1>GPA Calculator</h1>
    <p class="subtitle">For K-12 and college students</p>
 
    <div class="tabs">
      <button class="tab active" onclick="setLevel('school', this)">🏫 School (K-12)</button>
      <button class="tab" onclick="setLevel('college', this)">🎓 College</button>
    </div>
 
    <div class="scale-info" id="scale-info" style="display:none">
      <strong>School Scale (A–F / 4.0)</strong>
      90–100 = A (4.0) &nbsp;|&nbsp; 80–89 = B (3.0) &nbsp;|&nbsp; 70–79 = C (2.0) &nbsp;|&nbsp; 60–69 = D (1.0) &nbsp;|&nbsp; Below 60 = F (0.0)
    </div>
 
    <div id="subjects">
      <div class="row">
        <input type="text" placeholder="Subject (optional)">
        <input type="number" placeholder="Grade %" min="0">
      </div>
    </div>
 
    <div class="buttons">
      <button id="addBtn">+ Add Subject</button>
      <button id="calcBtn">Calculate GPA</button>
      <button id="clearBtn">Clear All</button>
    </div>
 
    <p id="error" class="error"></p>
 
    <div class="result-box">
      <div id="result">GPA: --</div>
      <div id="letter-grade"></div>
      <div id="grade-label"></div>
    </div>
 
    <script>
      let currentLevel = "school"
 
      const scales = {
        school: {
          title: "School Scale (K-12 / 4.0)",
          desc: "90–100 = A (4.0) &nbsp;|&nbsp; 80–89 = B (3.0) &nbsp;|&nbsp; 70–79 = C (2.0) &nbsp;|&nbsp; 60–69 = D (1.0) &nbsp;|&nbsp; Below 60 = F (0.0)"
        },
        college: {
          title: "College Scale (4.0 with Credits)",
          desc: "90–100 = A (4.0) &nbsp;|&nbsp; 80–89 = B (3.0) &nbsp;|&nbsp; 70–79 = C (2.0) &nbsp;|&nbsp; 60–69 = D (1.0) &nbsp;|&nbsp; Below 60 = F (0.0) &nbsp;|&nbsp; Credits = how many hours that class is worth (usually 3)"
        }
      }
 
      function setLevel(level, btn) {
        currentLevel = level
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"))
        btn.classList.add("active")
        document.getElementById("scale-info").innerHTML =
          "<strong>" + scales[level].title + "</strong>" + scales[level].desc
 
        // show/hide credits column
        let hasCredits = level === "college"
        document.querySelectorAll(".credits-input").forEach(function(el) {
          el.style.display = hasCredits ? "block" : "none"
        })
 
        // reset
        resetRows()
      }
 
      function makeRow() {
        let row = document.createElement("div")
        row.className = "row"
        let creditsDisplay = currentLevel === "college" ? "block" : "none"
        row.innerHTML =
          '<input type="text" placeholder="Subject (optional)">' +
          '<input type="number" placeholder="Grade %" min="0">' +
          '<input type="number" placeholder="Credits" min="1" class="credits-input" style="display:' + creditsDisplay + '">' +
          '<button class="delete-btn" onclick="this.parentElement.remove()">✕</button>'
        return row
      }
 
      function resetRows() {
        let container = document.getElementById("subjects")
        container.innerHTML = ""
        let row = document.createElement("div")
        row.className = "row"
        let creditsDisplay = currentLevel === "college" ? "block" : "none"
        row.innerHTML =
          '<input type="text" placeholder="Subject (optional)">' +
          '<input type="number" placeholder="Grade %" min="0">' +
          '<input type="number" placeholder="Credits" min="1" class="credits-input" style="display:' + creditsDisplay + '">'
        container.appendChild(row)
        document.getElementById("result").textContent = "GPA: --"
        document.getElementById("letter-grade").textContent = ""
        document.getElementById("grade-label").textContent = ""
        document.getElementById("error").textContent = ""
      }
 
      document.getElementById("addBtn").onclick = function() {
        document.getElementById("subjects").appendChild(makeRow())
      }
 
      document.getElementById("calcBtn").onclick = function() {
        let rows = document.querySelectorAll("#subjects .row")
        let totalPoints = 0
        let totalCredits = 0
        let error = ""
 
        rows.forEach(function(row) {
          let inputs = row.querySelectorAll("input")
          let gradeVal = inputs[1].value
          if (gradeVal === "") return
 
          let grade = parseFloat(gradeVal)
          if (isNaN(grade) || grade < 0) {
            error = "Please enter a valid grade (0 or above)."
            return
          }
 
          let points = 0
 
          if (currentLevel === "college") {
            // 4.0 GPA scale
            if (grade >= 97) points = 4.0
            else if (grade >= 93) points = 4.0
            else if (grade >= 90) points = 3.7
            else if (grade >= 87) points = 3.3
            else if (grade >= 83) points = 3.0
            else if (grade >= 80) points = 2.7
            else if (grade >= 77) points = 2.3
            else if (grade >= 73) points = 2.0
            else if (grade >= 70) points = 1.7
            else if (grade >= 67) points = 1.3
            else if (grade >= 63) points = 1.0
            else if (grade >= 60) points = 0.7
            else points = 0.0
 
            // extra credit above 100 pushes GPA over 4.0
            if (grade > 100) {
              let bonus = (grade - 100) * 0.04
              points = 4.0 + bonus
            }
 
            let credits = parseFloat(inputs[2].value) || 3
            totalPoints = totalPoints + (points * credits)
            totalCredits = totalCredits + credits
          } else {
            // School: straight percentage
            totalPoints = totalPoints + grade
            totalCredits = totalCredits + 1
          }
        })
 
        document.getElementById("error").textContent = error
        if (error !== "") return
 
        if (totalCredits === 0) {
          document.getElementById("error").textContent = "Please fill in at least one grade."
          return
        }
 
        let gpa = totalPoints / totalCredits
        let rounded = Math.round(gpa * 100) / 100
 
        let letter = ""
        let label = ""
 
        if (currentLevel === "college") {
          document.getElementById("result").textContent = "GPA: " + rounded
          if (rounded > 4.0) { letter = "A+ — Exceptional! 🌟"; label = "Extra credit pushed you above 4.0!" }
          else if (rounded >= 3.7) { letter = "A — Excellent! 🎉"; label = "Dean's List material!" }
          else if (rounded >= 3.0) { letter = "B — Great job! 😊"; label = "Above average, keep pushing!" }
          else if (rounded >= 2.0) { letter = "C — Decent 👍"; label = "Room to improve!" }
          else if (rounded >= 1.0) { letter = "D — Needs improvement 😬"; label = "Talk to your advisor!" }
          else { letter = "F — Failing ❌"; label = "Seek academic help now!" }
        } else {
          document.getElementById("result").textContent = "Average: " + rounded + "%"
          if (rounded >= 90) { letter = "A — Excellent! 🎉"; label = "Amazing work, keep it up!" }
          else if (rounded >= 80) { letter = "B — Great job! 😊"; label = "Above average, keep pushing!" }
          else if (rounded >= 70) { letter = "C — Decent 👍"; label = "Room to improve!" }
          else if (rounded >= 60) { letter = "D — Needs improvement 😬"; label = "Talk to your teacher!" }
          else { letter = "F — Failing ❌"; label = "Seek extra help now!" }
        }
 
        document.getElementById("letter-grade").textContent = letter
        document.getElementById("grade-label").textContent = label
      }
 
      document.getElementById("clearBtn").onclick = resetRows
    </script>
 
  </body>
</html>
